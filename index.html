<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrace 1923 Restaurant - Menyu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#222}
.header{background:#171717;color:#fff;text-align:center;padding:25px 15px 20px}
.logo{width:75px;height:75px;border-radius:50%;background:#c49a55;margin:auto;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;border:3px solid #fff}
.header h1{margin-top:12px;font-size:27px}
.header p{color:#ccc;margin-top:5px;font-size:14px}
.search-box{padding:15px;background:#fff;position:sticky;top:0;z-index:20}
.search-box input{width:100%;padding:13px 16px;border:1px solid #ddd;border-radius:25px;font-size:15px;outline:none}
.categories{display:flex;overflow-x:auto;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:73px;z-index:19}
.categories button{flex-shrink:0;border:none;padding:10px 15px;border-radius:20px;background:#eee;cursor:pointer;font-size:13px}
.categories button.active{background:#171717;color:#fff}
.container{max-width:1100px;margin:auto;padding:18px 12px 50px}
.section{margin-bottom:35px}
.section-title{font-size:23px;margin-bottom:15px;border-left:5px solid #c49a55;padding-left:10px}
.note{color:#a33;font-size:13px;margin:-8px 0 12px 15px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px)}
.card img{width:100%;height:140px;object-fit:contain;display:block;background:#ddd}
.card-content{padding:12px}
.card h3{font-size:14px;margin-bottom:6px}
.description{color:#777;font-size:12px;line-height:1.4;min-height:32px}
.price{margin-top:10px;color:#b48742;font-size:17px;font-weight:bold}
.no-price{color:#777;font-size:13px;font-weight:normal}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:15px;overflow:hidden;position:relative}
.modal-box img{width:100%;height:280px;object-fit:contain;background:#ddd}
.modal-content{padding:20px}
.modal-content h2{margin-bottom:10px}
.modal-content p{color:#666;line-height:1.5}
.modal-price{color:#b48742;font-size:22px;font-weight:bold;margin-top:15px}
.close{position:absolute;top:10px;right:10px;width:35px;height:35px;border:none;border-radius:50%;background:#fff;font-size:22px;cursor:pointer}
.footer{background:#171717;color:#aaa;text-align:center;padding:25px;font-size:13px}
@media(min-width:800px){.products{grid-template-columns:repeat(3,1fr)}.card img{height:210px}.card h3{font-size:16px}}
</style>
</head>
<body>

    <div class="logo">T23</div>
    <h1>Terrace 1923 Restaurant</h1>
    <p>Milli mətbəx • Kabab • İsti yeməklər</p>
</header>

<div class="search-box">
    <input type="text" id="search" placeholder="🔍 Menyuda axtar..." oninput="searchProducts()">
</div>

<nav class="categories">
    <button class="active" onclick="showCategory('all',this)">Hamısı</button>
    <button onclick="showCategory('kabab',this)">Kabablar</button>
    <button onclick="showCategory('isti',this)">İsti yeməklər</button>
    <button onclick="showCategory('soup',this)">Şorbalar</button>
    <button onclick="showCategory('fish',this)">Balıqlar</button>
    <button onclick="showCategory('salad',this)">Salatlar</button>
    <button onclick="showCategory('drink',this)">İçkilər</button>
    <button onclick="showCategory('alcohol',this)">Spirtli içkilər</button>
</nav>

<main class="container" id="menu"></main>

<footer class="footer">
    <p>📞 <a href="tel:+994505686600" style="color:#c49a55;text-decoration:none">050 568 66 00</a></p>
    <p style="margin-top:6px">📍 Xankəndi şəhəri, Zəfər ticarət mərkəzi</p>
    <p style="margin-top:6px">🕒 Hər gün 09:00 - 00:00</p>
    <p style="margin-top:12px">© 2026 Terrace 1923 Restaurant</p>
</footer>

<div class="modal" id="modal" onclick="closeOutside(event)">
    <div class="modal-box">
        <button class="close" onclick="closeModal()">×</button>
        <img id="modalImage" src="" alt="" onerror="this.onerror=null;this.src=PLACEHOLDER">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            <div class="modal-price" id="modalPrice"></div>
        </div>
    </div>

const menu = raw.map(r => ({category:r[0], name:r[1], price:r[2], image:"images/"+r[3], description:r[4]}));

const categoryNames = {
    kabab:"Kabablar", isti:"İsti yeməklər", soup:"Şorbalar", fish:"Balıqlar",
    salad:"Salatlar", drink:"Spirtsiz içkilər", alcohol:"Spirtli içkilər"
};

function priceText(item){
    return item.price !== null ? item.price.toFixed(2) + " AZN" : null;
}

function renderMenu(list = menu){
    const container = document.getElementById("menu");
    container.innerHTML = "";

    if(list.length === 0){
        container.innerHTML = '<div style="text-align:center;padding:50px 10px;color:#777"><h2>Məhsul tapılmadı</h2><p>Axtarış sözünü dəyişin.</p></div>';
        return;
    }

    [...new Set(list.map(i => i.category))].forEach(category => {
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = '<h2 class="section-title">' + categoryNames[category] + '</h2>' +
            (category === "alcohol" ? '<p class="note">18 yaşdan kiçiklərə spirtli içki satılmır.</p>' : '') +
            '<div class="products"></div>';
        const box = section.querySelector(".products");

        list.filter(i => i.category === category).forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML =
                '<img src="' + item.image + '" alt="' + item.name + '" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER">' +
                '<div class="card-content"><h3>' + item.name + '</h3>' +
                '<div class="description">' + item.description + '</div>' +
                '<div class="price">' + (priceText(item) || '<span class="no-price">Qiymət soruşun</span>') + '</div></div>';
            card.onclick = () => openModal(item);
            box.appendChild(card);
        });
        container.appendChild(section);
    });
}

function showCategory(category, button){
    document.querySelectorAll(".categories button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    document.getElementById("search").value = "";
    renderMenu(category === "all" ? menu : menu.filter(i => i.category === category));
}

function searchProducts(){
    const v = document.getElementById("search").value.toLowerCase().trim();
    renderMenu(!v ? menu : menu.filter(i =>
        i.name.toLowerCase().includes(v) || i.description.toLowerCase().includes(v)));
}

function openModal(item){
    const img = document.getElementById("modalImage");
    img.src = item.image;
    document.getElementById("modalTitle").innerText = item.name;
    document.getElementById("modalDescription").innerText = item.description;
    document.getElementById("modalPrice").innerText = priceText(item) || "Qiymət soruşun";
    document.getElementById("modal").style.display = "flex";
}
function closeModal(){ document.getElementById("modal").style.display = "none"; }
function closeOutside(e){ if(e.target.id === "modal") closeModal(); }

renderMenu(menu);
</script>

</html>
